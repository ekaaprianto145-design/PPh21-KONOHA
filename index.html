<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem PPh 21 Konoha</title>
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-card: #181c26;
      --bg-card-2: #202634;
      --naruto-orange: #ff6b00;
      --naruto-orange-glow: rgba(255, 107, 0, 0.35);
      --naruto-gold: #ffb703;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #2d3548;
      --success: #16a34a;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f1916 0%, var(--bg-dark) 60%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .topbar {
      background: rgba(24, 28, 38, 0.96);
      border-bottom: 2px solid var(--naruto-orange);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .konoha-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--naruto-orange), var(--naruto-gold));
      color: #111;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      box-shadow: 0 0 15px var(--naruto-orange-glow);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.1rem;
      color: var(--naruto-gold);
      letter-spacing: 0.5px;
    }

    .brand small {
      color: var(--text-muted);
      font-size: 0.76rem;
      display: block;
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.84rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--naruto-orange), #e05300);
      color: #fff;
      box-shadow: 0 4px 12px var(--naruto-orange-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: var(--bg-card-2);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover, .btn-secondary.active {
      border-color: var(--naruto-orange);
      color: var(--naruto-gold);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .container {
      max-width: 1380px;
      margin: 22px auto;
      padding: 0 18px 44px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .lock-screen {
      max-width: 440px;
      margin: 80px auto;
      text-align: center;
      border: 2px solid var(--naruto-orange);
      box-shadow: 0 0 35px var(--naruto-orange-glow);
    }

    .lock-screen h2 {
      color: var(--naruto-gold);
      margin-bottom: 8px;
    }

    .lock-screen p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    input, select {
      background: #10141d;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--naruto-orange);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
    }

    .hero-naruto {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: linear-gradient(120deg, rgba(255, 107, 0, 0.18), rgba(24, 28, 38, 0.95));
      border: 1px solid var(--naruto-orange);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }

    .menu-tile {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-tile:hover {
      border-color: var(--naruto-orange);
      transform: translateY(-3px);
    }

    .menu-tile h3 {
      color: var(--naruto-gold);
      margin-bottom: 6px;
    }

    .menu-tile p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: #252c3d;
      color: var(--naruto-gold);
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 9px 10px;
      border-bottom: 1px solid #242b3b;
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255, 107, 0, 0.05);
    }

    .tunjangan-rect-wrap {
      overflow-x: auto;
      border-radius: 6px;
      border: 2px solid #eab308;
      background: #121620;
    }

    .tunjangan-rect-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .tunjangan-rect-table th,
    .tunjangan-rect-table td {
      border: 1px solid #475569;
      padding: 6px 8px;
      text-align: center;
      border-radius: 0;
    }

    .tunjangan-rect-table th.bulan-col {
      background: #facc15;
      color: #111827;
      font-weight: 800;
      letter-spacing: 0.4px;
      min-width: 106px;
    }

    .tunjangan-rect-table th.nama-col {
      background: #1e293b;
      color: #ff4d4d;
      font-weight: 800;
      text-align: left;
      min-width: 120px;
    }

    .tunjangan-rect-table td.nama-cell {
      background: #182030;
      color: #f8fafc;
      font-weight: 700;
      text-align: left;
    }

    .tunjangan-rect-table input.month-rect-input {
      width: 100%;
      min-width: 96px;
      padding: 5px 7px;
      font-size: 0.82rem;
      text-align: right;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0d1117;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .tunjangan-rect-table input.month-rect-input:focus {
      border-color: #facc15;
      outline: none;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .inline-input {
      min-width: 120px;
      padding: 6px 8px;
      font-size: 0.84rem;
    }

    .inline-select {
      min-width: 96px;
      padding: 6px 8px;
      font-size: 0.84rem;
    }

    .slip-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .slip-paper {
      background: #ffffff;
      color: #111827;
      border-radius: 12px;
      padding: 28px;
      max-width: 800px;
      margin: 0 auto;
      border: 2px solid #ea580c;
    }

    .slip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ea580c;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .slip-header h2 {
      color: #c2410c;
      font-size: 1.3rem;
    }

    .slip-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 20px;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .slip-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
    }

    .slip-table th, .slip-table td {
      color: #111827;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
    }

    .slip-table th {
      background: #fff7ed;
      color: #9a3412;
    }

    .slip-total {
      background: #ffedd5 !important;
      font-weight: 700;
    }

    .slip-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 28px;
      font-size: 0.88rem;
    }

    .hidden {
      display: none !important;
    }

    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .topbar, .no-print {
        display: none !important;
      }
      .container {
        margin: 0;
        padding: 0;
        max-width: 100%;
      }
      .card {
        border: none;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }
      .slip-paper {
        border: 1px solid #000;
        box-shadow: none;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- LAYAR SANDI MASUK -->
  <div id="lockScreen" class="card lock-screen">
    <div class="konoha-badge" style="margin: 0 auto 12px;">葉</div>
    <h2>GERBANG SANDI KONOHA</h2>
    <p>Masukkan sandi rahasia shinobi untuk membuka Sistem PPh 21 & Slip Gaji.</p>
    <form id="formSandi">
      <input type="password" id="sandiInput" placeholder="Masukkan sandi..." autocomplete="off" required />
      <div style="margin-top: 14px;">
        <button type="submit" id="btnBukaSandi" class="btn-primary" style="width: 100%;">🔓 Buka Segel Sandi</button>
      </div>
    </form>
    <div id="sandiError" class="error-msg"></div>
  </div>

  <!-- APLIKASI UTAMA -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="brand">
        <div class="konoha-badge">葉</div>
        <div>
          <h1>SISTEM PPh 21 KONOHA</h1>
          <small>Menu Utama • Daftar & Golongan TER • Tunjangan • Perhitungan • Slip Gaji</small>
        </div>
      </div>
      <nav class="nav-buttons">
        <button type="button" class="btn-secondary active" id="nav-home" onclick="pindahHalaman('home')">🏠 Menu Utama</button>
        <button type="button" class="btn-secondary" id="nav-daftar" onclick="pindahHalaman('daftar')">📝 Daftar & TER</button>
